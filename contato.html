<div class="container">
<header class="cabecalho">

    <h1>Contato</h1>

    <p>
        Envie uma mensagem.
    </p>

</header>
</div>
<main class="container">

    <div class="formulario">

        <h2>Formulário</h2>

        <form>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" class="form-control" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" class="form-control" required>

            <label for="assunto">Assunto:</label>

            <select id="assunto" class="form-select">

                <option>times excelentes</option>
                <option>times bons</option>
                <option>times mais ou menos</option>
                <option>times ruins</option>
                <option>gremio</option>

            </select>

            <label for="mensagem">Mensagem:</label>

            <textarea id="mensagem" class="form-control" rows="5"></textarea>

            <button type="submit" class="btn btn-success mt-3">
                Enviar
            </button>

        </form>

    </div>
<img src="https://images.genius.com/44475f79896e539daf9ffe7b731ed65c.999x999x1.png" alt="goat" class="caneta">
